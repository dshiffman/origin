<svg xmlns="http://www.w3.org/2000/svg" xmlns:shaper="http://www.shapertools.com/namespaces/shaper" width="200mm" height="150mm" viewBox="0 0 200 150">
  <title>Bottom, cut 1</title>
  <desc>
    Bit: 6.350 mm (0.250 in) - set this on Origin.
    Cut types: exterior @ 12.50 mm deep x1, interior @ 12.50 mm deep x4.
    Geometry is the finished part size; Origin applies the bit offset.
    Colours per notes/shaper-svg.md (Shaper cut type encoding).
    shaper:cutDepth is a target and over-depth check; set the cut depth on Origin yourself.
    Material thickness: 12.00 mm (PLACEHOLDER - NOT MEASURED, do not cut good stock).
    Through-cut depth: 12.50 mm (thickness + 0.5 mm overcut).
    Corner reliefs: dogbone, sized for the 6.35 mm bit. A different bit needs a re-run.
    Panel orientation doesn't matter: every notch and slot goes right through.
  </desc>
